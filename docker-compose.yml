services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: custo_soja
      POSTGRES_USER: soja
      POSTGRES_PASSWORD: soja
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soja -d custo_soja"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://soja:soja@postgres:5432/custo_soja
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node server.js"

volumes:
  postgres_data:
