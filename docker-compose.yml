services:
  postgres:
    image: postgres:16-alpine
    container_name: custo_soja_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: custo_soja
      POSTGRES_USER: soja
      POSTGRES_PASSWORD: soja
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soja -d custo_soja"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: custo_soja_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://soja:soja@postgres:5432/custo_soja
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
